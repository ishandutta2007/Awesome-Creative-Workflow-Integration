<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .node-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: dash 20s linear infinite;
    }
    .orb-float-1 {
      animation: float1 8s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: float2 9s ease-in-out infinite alternate;
    }
    .tag-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes float1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.15); }
    }
    @keyframes float2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-25px, -15px) scale(1.1); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }
  </style>

  <!-- Background base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />

  <!-- Grid overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Background Dynamic Glowing Orbs (Deep in background) -->
  <g filter="url(#blurFilter)">
    <circle class="orb-float-1" cx="200" cy="100" r="130" fill="url(#glowCyan)" />
    <circle class="orb-float-2" cx="1000" cy="240" r="150" fill="url(#glowPurple)" />
    <circle cx="600" cy="180" r="100" fill="#3b82f6" opacity="0.1" />
  </g>

  <!-- Dynamic Pipeline Flow Lines (Behind text, subtle opacity) -->
  <g opacity="0.45">
    <path class="flow-line" d="M -50 90 Q 300 20, 600 90 T 1250 80" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path class="flow-line" d="M -50 270 Q 350 320, 700 260 T 1250 280" fill="none" stroke="url(#lineGrad)" stroke-width="2" style="animation-direction: reverse; animation-duration: 25s;"/>
    <path class="flow-line" d="M 100 380 Q 400 160, 1100 40" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" style="animation-duration: 18s;"/>
  </g>

  <!-- Subtle workflow nodes in background -->
  <g opacity="0.4" class="node-pulse">
    <circle cx="180" cy="90" r="4" fill="#38bdf8" />
    <circle cx="600" cy="90" r="5" fill="#818cf8" />
    <circle cx="1020" cy="80" r="4" fill="#c084fc" />
    <circle cx="250" cy="280" r="4" fill="#38bdf8" />
    <circle cx="700" cy="260" r="5" fill="#818cf8" />
    <circle cx="980" cy="275" r="4" fill="#ec4899" />
  </g>

  <!-- Foreground Content: Titles, Badges, and Descriptions -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="0" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="-118" cy="14" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-104" y="18" fill="#94a3b8" class="tag-pill">PRODUCTION &amp; PIPELINE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Creative Workflow Integration
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#cbd5e1" letter-spacing="0.2">
      Curated Pipelines, Production Tracking, Asset Management &amp; DCC Interoperability
    </text>

    <!-- Workflow Feature Badges / Highlights -->
    <g transform="translate(600, 222)">
      <!-- Pill 1: VFX & Animation -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="82.5" y="21" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🎬 VFX &amp; Animation</text>
      </g>
      <!-- Pill 2: Asset Tracking & MAM -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="82.5" y="21" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">📦 Asset &amp; MAM</text>
      </g>
      <!-- Pill 3: Review & Approval -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
        <text x="87.5" y="21" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">🎯 Review &amp; Approval</text>
      </g>
      <!-- Pill 4: Open Standards -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
        <text x="85" y="21" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">⚡ Open Standards</text>
      </g>
    </g>

    <!-- Bottom Metadata Text -->
    <text x="600" y="305" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
      OpenUSD • OpenColorIO • OpenTimelineIO • OpenCue • ShotGrid • Frame.io • Kitsu • AYON
    </text>
  </g>
</svg>